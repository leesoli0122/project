<!doctype html>
<html lang="ko">
<head>
  <meta charset="euc-kr" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Namo CrossEditor - EUC-KR 테스트</title>

  <!-- 데모 스크립트: UTF-8 이므로 charset 꼭 지정 -->
  <script
    type="text/javascript"
    src="https://comp.namoeditor.co.kr/demo/ce4/crosseditor/js/namo_scripteditor.js?ver=46026_1"
    charset="utf-8"></script>

  <style>
    body {margin:0; padding:24px; font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;}
    form {max-width:900px; margin:auto;}
    #editorArea {width:100%; height:500px; border:1px solid #ddd;}
  </style>
</head>
<body>
  <form id="postForm" onsubmit="return handleSubmit(event)">
    <h1>글쓰기</h1>
    <div id="editorArea"></div>
    <iframe id="NamoSE_Ifr__crosseditor4" frameborder="0" scrolling="no" title="크로스에디터 영역 - 편집영역 다음탭 : Esc, 편집영역 이전탭 : Shift+Esc" allowtransparency="allowTransparency" src="https://comp.namoeditor.co.kr/demo/ce4/crosseditor/config/htmls/crosseditor.html?ebdi=TWpBeU5Jd09lQXhBN01lME1laz0:" style="border: 0pt none; margin: 0pt; padding: 0pt; background-color: transparent; background-image: none; width: 100%; height: 515px; z-index: 20000;"></iframe>
    <textarea id="editorValue" name="editorValue" style="display:none"></textarea>
    <p style="margin-top:16px;"><button type="submit">저장</button></p>
  </form>

  <script>
    if (typeof NamoSE === 'undefined') {
      alert('나모 스크립트를 불러오지 못했습니다. (경로/인코딩 확인)');
    } else {
      var CrossEditor = new NamoSE('namoeditor1');

      // ★ 데모 서버의 에디터 기준 경로 (끝에 / 필수)
      CrossEditor.params.EditorBaseURL = "https://comp.namoeditor.co.kr/demo/ce4/crosseditor/";

      CrossEditor.params.Width = "100%";
      CrossEditor.params.ParentEditor = document.getElementById("editorArea");

      // 초기화 완료 콜백(선택)
      window.OnInitCompleted = function(e){
        e.editorTarget.SetBodyValue("<p>초기 내용입니다.</p>");
      };

      CrossEditor.EditorStart();
    }

    function handleSubmit(e){
      e.preventDefault();
      document.getElementById("editorValue").value = CrossEditor.GetBodyValue();
      alert("전송될 내용 미리보기:\n\n" + document.getElementById("editorValue").value);
      return false;
    }
  </script>
</body>
</html>
